name: Multi-agent evaluation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UDACITY_OPENAI_API_KEY: ${{ secrets.UDACITY_OPENAI_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      OPENAI_BASE_URL: https://openai.vocareum.com/v1
      OPENAI_MODEL: gpt-4o-mini

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: project/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r project/requirements.txt

      - name: Run multi-agent evaluation
        working-directory: project
        run: python project_starter.py

      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-agent-test-results
          path: project/test_results.csv
          if-no-files-found: warn
